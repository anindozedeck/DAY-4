<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Live Weather Lookup</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172b4d;
      background: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 64px 20px;
      background:
        radial-gradient(ellipse at 50% -15%, #dceaff 0, transparent 55%),
        #f4f7fb;
    }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #3569a8;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #172b4d;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: -0.045em;
      text-align: center;
    }

    .intro {
      max-width: 440px;
      margin: 12px auto 30px;
      color: #5c6f89;
      line-height: 1.6;
      text-align: center;
    }

    .card {
      padding: clamp(20px, 5vw, 32px);
      border: 1px solid #e1e8f1;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 50px rgb(34 61 97 / 9%);
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #344966;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px 14px;
      border: 1px solid #cbd6e4;
      border-radius: 9px;
      color: #172b4d;
      font: inherit;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input::placeholder { color: #8998aa; }

    input:focus {
      border-color: #3978c5;
      box-shadow: 0 0 0 3px rgb(57 120 197 / 16%);
    }

    button {
      display: inline-flex;
      min-width: 112px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #2468b4;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #1b5799;
    }

    button:focus-visible {
      outline: 3px solid #9bc4f1;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.8;
    }

    .hint {
      margin: 10px 0 0;
      color: #77879b;
      font-size: 0.82rem;
    }

    #result {
      min-height: 72px;
      margin-top: 22px;
      padding: 17px;
      border: 1px solid #e1e8f1;
      border-radius: 12px;
      background: #f8fafd;
      color: #536780;
    }

    #result[data-state="loading"] {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #355f91;
    }

    #result[data-state="error"] {
      border-color: #f1c4c2;
      background: #fff7f6;
      color: #a3332c;
    }

    .spinner {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border: 2px solid #c5d8ee;
      border-top-color: #2468b4;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .country-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 17px;
      color: #172b4d;
      font-size: 1.35rem;
    }

    .country-heading img {
      width: 42px;
      height: auto;
      border: 1px solid #e1e8f1;
      border-radius: 4px;
    }

    dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
      margin: 0;
    }

    dl div {
      padding: 12px;
      border-radius: 8px;
      background: #fff;
    }

    dt {
      margin-bottom: 5px;
      color: #718199;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    dd {
      margin: 0;
      color: #263d5c;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      body { padding-top: 42px; }
      .search-row { flex-direction: column; }
      button { min-height: 46px; }
      dl { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Live conditions</p>
    <h1>Weather Lookup</h1>
    <p class="intro">Search for a city to see its current weather, temperature, and wind—fetched live from Open-Meteo.</p>

    <section class="card" aria-label="Weather search">
      <form id="weatherForm">
        <label for="cityInput">City name</label>
        <div class="search-row">
          <input
            id="cityInput"
            name="city"
            type="search"
            placeholder="Try Tokyo or Nairobi"
            autocomplete="off"
            required
          >
          <button id="searchButton" type="submit">Search</button>
        </div>
        <p class="hint">Enter a city name and press Search or Enter.</p>
      </form>

      <div id="result" data-state="idle" role="status" aria-live="polite" aria-atomic="true">
        Current weather will appear here.
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("weatherForm");
    const cityInput = document.getElementById("cityInput");
    const searchButton = document.getElementById("searchButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", loadWeather);

    async function loadWeather(event) {
      event.preventDefault();
      const city = cityInput.value.trim().replace(/\s+/g, " ");

      if (!city) {
        showError("Please enter a city name.");
        cityInput.focus();
        return;
      }

      searchButton.disabled = true;
      searchButton.innerHTML = '<span class="spinner" aria-hidden="true"></span>Searching';
      result.dataset.state = "loading";
      result.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>Loading...</span>';

      try {
        const geocodingParams = new URLSearchParams({
          name: city,
          count: "1",
          language: "en",
          format: "json"
        });
        const locationResponse = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?${geocodingParams}`
        );

        if (!locationResponse.ok) {
          throw new Error(`The location service returned an error (${locationResponse.status}). Please try again.`);
        }

        const locations = await locationResponse.json();
        const location = Array.isArray(locations.results) ? locations.results[0] : null;
        if (!location) {
          throw new Error(`No city found for “${city}”. Check the spelling and try again.`);
        }

        const weatherParams = new URLSearchParams({
          latitude: String(location.latitude),
          longitude: String(location.longitude),
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m",
          timezone: "auto",
          wind_speed_unit: "kmh"
        });
        const weatherResponse = await fetch(
          `https://api.open-meteo.com/v1/forecast?${weatherParams}`
        );

        if (!weatherResponse.ok) {
          throw new Error(`The weather service returned an error (${weatherResponse.status}). Please try again.`);
        }

        const weather = await weatherResponse.json();
        if (!weather.current) {
          throw new Error("The weather service did not return current conditions. Please try again.");
        }
        showWeather(location, weather);
      } catch (error) {
        const message = error instanceof TypeError
          ? "Could not connect to Open-Meteo. Check your internet connection and try again."
          : error instanceof Error
            ? error.message
            : "Weather data could not be loaded. Please try again.";
        showError(message);
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = "Search";
      }
    }

    function showWeather(location, weather) {
      result.replaceChildren();
      result.dataset.state = "success";

      const heading = document.createElement("h2");
      heading.className = "country-heading";
      const place = [location.name, location.country].filter(Boolean).join(", ");
      heading.textContent = place || "Weather";

      const details = document.createElement("dl");
      const current = weather.current;
      const units = weather.current_units || {};
      const temperature = Number.isFinite(current.temperature_2m)
        ? `${current.temperature_2m}${units.temperature_2m || "°C"}`
        : "N/A";
      const feelsLike = Number.isFinite(current.apparent_temperature)
        ? `${current.apparent_temperature}${units.apparent_temperature || "°C"}`
        : "N/A";
      const humidity = Number.isFinite(current.relative_humidity_2m)
        ? `${current.relative_humidity_2m}${units.relative_humidity_2m || "%"}`
        : "N/A";
      const wind = Number.isFinite(current.wind_speed_10m)
        ? `${current.wind_speed_10m} ${units.wind_speed_10m || "km/h"}`
        : "N/A";

      appendDetail(details, "Conditions", weatherDescription(current.weather_code));
      appendDetail(details, "Temperature", temperature);
      appendDetail(details, "Feels like", feelsLike);
      appendDetail(details, "Humidity", humidity);
      appendDetail(details, "Wind", wind);

      result.append(heading, details);
    }

    function weatherDescription(code) {
      const descriptions = {
        0: "Clear sky",
        1: "Mainly clear",
        2: "Partly cloudy",
        3: "Overcast",
        45: "Fog",
        48: "Depositing rime fog",
        51: "Light drizzle",
        53: "Moderate drizzle",
        55: "Dense drizzle",
        56: "Light freezing drizzle",
        57: "Dense freezing drizzle",
        61: "Slight rain",
        63: "Moderate rain",
        65: "Heavy rain",
        66: "Light freezing rain",
        67: "Heavy freezing rain",
        71: "Slight snowfall",
        73: "Moderate snowfall",
        75: "Heavy snowfall",
        77: "Snow grains",
        80: "Slight rain showers",
        81: "Moderate rain showers",
        82: "Violent rain showers",
        85: "Slight snow showers",
        86: "Heavy snow showers",
        95: "Thunderstorm",
        96: "Thunderstorm with slight hail",
        99: "Thunderstorm with heavy hail"
      };
      return descriptions[code] || "Unknown conditions";
    }

    function appendDetail(list, label, value) {
      const item = document.createElement("div");
      const term = document.createElement("dt");
      const description = document.createElement("dd");
      term.textContent = label;
      description.textContent = value;
      item.append(term, description);
      list.append(item);
    }

    function showError(message) {
      result.dataset.state = "error";
      result.textContent = message;
    }
  </script>
</body>
</html>
